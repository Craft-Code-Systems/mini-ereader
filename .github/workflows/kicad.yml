name: KiCad

# Cloud "KiCad-capable environment": runs kicad-cli (v10) to check the board
# and export fabrication files. Interactive capture/routing happen locally in
# KiCad; this gates the result and produces downloadable outputs (artifacts).
#
# Target is the single canonical board, ereader.kicad_pcb (KiCad 7 format;
# kicad-cli 10 opens/migrates it automatically). The electrical source of
# truth is the ereader-*.md docs at the repo root (connection list,
# pcb-design, footprints, schematic) plus the ereader-kicad.net netlist.
#
# Pinned to 10.0.0 (not 8.0): kicad-cli's "pcb drc" only checks whatever
# zone fill is already stored in the file unless --refill-zones is passed -
# it does NOT recompute by default. Passing --refill-zones here forces a
# genuine from-scratch fill/connectivity check on every run, so this result
# can't be masked by (or blamed on) stale fill data committed earlier.
# See CHANGELOG.md (2026-09-11 entries) for the investigation that found
# this - a KiCad 8.0 run previously reported 3 "unconnected_items" between
# 'GND_F.Cu' and itself that didn't move across several rounds of board
# fixes.

on:
  push:
    paths: ["ereader.kicad_pcb", "ereader-kicad.net", "preflight.py", ".github/workflows/kicad.yml"]
  pull_request:
    paths: ["ereader.kicad_pcb", "ereader-kicad.net", "preflight.py", ".github/workflows/kicad.yml"]
  workflow_dispatch:

jobs:
  drc-export:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.0
      options: --user root          # let actions/checkout own the workspace
    env:
      HOME: /root                    # writable config/home for kicad-cli
      PCB: ereader.kicad_pcb         # the canonical board
    steps:
      - uses: actions/checkout@v4

      - name: KiCad version
        run: kicad-cli version

      # GATE 1 - board/netlist parity. kicad-cli DRC only checks a board's
      # internal connectivity; it never compares against the netlist, so a
      # board simply missing components passes DRC. This step fails the job if
      # any ereader-kicad.net component is absent from ereader.kicad_pcb (the
      # exact gap that let a routed board reach main without the EPD DC-DC
      # block). Run "Update PCB from Netlist" in KiCad to resolve.
      - name: Preflight - board matches netlist
        run: python3 preflight.py

      # GATE 2 - DRC. Now that the board is meant to be routed, DRC is a hard
      # gate (was informational while placed-but-unrouted). --refill-zones
      # forces a genuine from-scratch fill/connectivity check; the report is
      # printed and also uploaded below. --exit-code-violations makes a
      # nonzero result (violations OR unconnected items, per the project's
      # rule severities) fail the job. See CHANGELOG.md.
      - name: DRC (ereader.kicad_pcb)
        if: always()
        run: |
          set -o pipefail
          kicad-cli pcb drc --refill-zones --exit-code-violations \
            --output drc.rpt "$PCB"; rc=$?
          echo "----- drc.rpt -----"; cat drc.rpt || true
          exit $rc

      # Only reached when both gates pass, so gerbers are never generated from
      # an out-of-sync or DRC-dirty board.
      - name: Export gerbers + drill
        run: |
          mkdir -p fab
          kicad-cli pcb export gerbers --output fab/ "$PCB"
          kicad-cli pcb export drill   --output fab/ "$PCB"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-outputs
          path: |
            drc.rpt
            fab/
          if-no-files-found: ignore
