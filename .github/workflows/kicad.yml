name: KiCad

# Cloud "KiCad-capable environment": runs kicad-cli (v10) to check the board
# and export fabrication files. Interactive capture/routing happen locally in
# KiCad; this gates the result and produces downloadable outputs (artifacts).
#
# Target is the single canonical board, ereader.kicad_pcb (KiCad 7 format;
# kicad-cli 10 opens/migrates it automatically). The electrical source of
# truth is the ereader-*.md docs at the repo root (connection list,
# pcb-design, footprints, schematic) plus the ereader-kicad.net netlist.
#
# Pinned to 10.0.0 (not 8.0): kicad-cli's "pcb drc" only checks whatever
# zone fill is already stored in the file unless --refill-zones is passed -
# it does NOT recompute by default. Passing --refill-zones here forces a
# genuine from-scratch fill/connectivity check on every run, so this result
# can't be masked by (or blamed on) stale fill data committed earlier.
# See CHANGELOG.md (2026-09-11 entries) for the investigation that found
# this - a KiCad 8.0 run previously reported 3 "unconnected_items" between
# 'GND_F.Cu' and itself that didn't move across several rounds of board
# fixes.

on:
  push:
    paths: ["ereader.kicad_pcb", "ereader-kicad.net", ".github/workflows/kicad.yml"]
  pull_request:
    paths: ["ereader.kicad_pcb", "ereader-kicad.net", ".github/workflows/kicad.yml"]
  workflow_dispatch:

jobs:
  drc-export:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.0
      options: --user root          # let actions/checkout own the workspace
    env:
      HOME: /root                    # writable config/home for kicad-cli
      PCB: ereader.kicad_pcb         # the canonical board
    steps:
      - uses: actions/checkout@v4

      - name: KiCad version
        run: kicad-cli version

      # DRC is informational until the board is fully routed (the first-try
      # board is placed but not routed). To gate CI on a clean board later,
      # add --exit-code-violations and drop continue-on-error.
      - name: DRC (ereader.kicad_pcb)
        continue-on-error: true
        run: kicad-cli pcb drc --refill-zones --output drc.rpt "$PCB" && cat drc.rpt || true

      - name: Export gerbers + drill
        continue-on-error: true
        run: |
          mkdir -p fab
          kicad-cli pcb export gerbers --output fab/ "$PCB" || true
          kicad-cli pcb export drill   --output fab/ "$PCB" || true

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-outputs
          path: |
            drc.rpt
            fab/
          if-no-files-found: ignore
